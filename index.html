<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Maddie's Treat Catch</title>
<style>
  :root{
    --sky1:#8ec5ff; --sky2:#c8e9ff; --grass:#7ec85a; --grass2:#5fae3c;
    --accent:#ff7a59; --accent2:#ffb23e; --ink:#2b2135; --panel:rgba(255,255,255,.92);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    background:#1b2433;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;color:var(--ink);overflow:hidden;
  }
  #wrap{
    position:relative;width:min(96vw,480px);height:min(92vh,720px);
    border-radius:22px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 0 0 4px rgba(255,255,255,.15);
    background:linear-gradient(180deg,#f9b7d2,#f29ac0 60%);
    touch-action:none;user-select:none;
  }
  canvas{display:block;width:100%;height:100%;}

  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:center;padding:12px 16px;pointer-events:none;font-weight:bold;}
  .pill{background:var(--panel);padding:6px 12px;border-radius:999px;
    box-shadow:0 3px 0 rgba(0,0,0,.12);font-size:15px;}
  #lives{letter-spacing:2px;font-size:18px;}

  /* Overlays */
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
    background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,200,225,.3));
    backdrop-filter:blur(2px);}
  .hidden{display:none !important;}
  .card{background:var(--panel);border-radius:20px;padding:26px 24px;max-width:340px;
    box-shadow:0 16px 40px rgba(0,0,0,.35);}
  h1{margin:0 0 4px;font-size:30px;color:var(--ink);line-height:1.05;}
  h1 span{color:var(--accent);}
  h2{margin:0 0 6px;font-size:26px;}
  p{margin:8px 0;font-size:15px;color:#4a4257;line-height:1.4;}
  .big{font-size:40px;margin:2px 0;}
  button{
    font-family:inherit;font-weight:bold;font-size:19px;cursor:pointer;
    color:#fff;border:none;border-radius:14px;padding:14px 30px;margin-top:6px;
    background:linear-gradient(180deg,var(--accent2),var(--accent));
    box-shadow:0 5px 0 #d9542f,0 10px 20px rgba(0,0,0,.25);
    transition:transform .05s,box-shadow .05s;
  }
  button:active{transform:translateY(4px);box-shadow:0 1px 0 #d9542f;}
  .hint{font-size:13px;color:#6b6478;margin-top:10px;}
  .emoji-row{font-size:26px;letter-spacing:4px;margin:6px 0 0;}
  .byline{font-size:14px;font-weight:bold;color:var(--accent);margin:2px 0 0;}
  .chars{display:flex;gap:8px;justify-content:center;}
  .charBtn{display:flex;flex-direction:column;align-items:center;gap:1px;margin:0;
    font-size:22px;padding:7px 14px;border-radius:14px;color:var(--ink);
    background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);border:2px solid transparent;}
  .charBtn small{font-size:11px;font-weight:bold;color:#6b6478;}
  .charBtn.selected{border-color:var(--accent);background:#fff0ea;}
  .charBtn:active{transform:translateY(2px);box-shadow:none;}
  .score-line{font-size:17px;color:#4a4257;}
  .best{color:var(--accent);font-weight:bold;}
  #muteBtn{position:absolute;bottom:10px;left:12px;
    pointer-events:auto;background:var(--panel);color:var(--ink);
    font-size:13px;padding:5px 12px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.12);
    display:none;}
  #muteBtn:active{transform:translateY(2px);box-shadow:none;}
  #endBtn{position:absolute;bottom:10px;right:12px;pointer-events:auto;
    background:var(--panel);color:var(--ink);font-size:13px;padding:5px 12px;
    border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.12);display:none;font-weight:bold;}
  #endBtn:active{transform:translateY(2px);box-shadow:none;}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .modeBtn{display:flex;flex-direction:column;align-items:center;gap:2px;margin:0;
    padding:12px 8px;font-size:15px;border-radius:14px;color:#fff;
    background:linear-gradient(180deg,#ff7fb6,#ff4f98);
    box-shadow:0 4px 0 #d63a7a,0 8px 16px rgba(0,0,0,.2);}
  .modeBtn small{font-weight:normal;font-size:11px;opacity:.95;}
  .modeBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d63a7a;}
  button.ghost{background:#fff;color:var(--accent);box-shadow:0 4px 0 #e2b9a9;
    font-size:16px;padding:10px 24px;}
  button.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 #e2b9a9;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="pill">🦴 <span id="score">0</span></div>
    <div class="pill" id="lives">❤️❤️❤️</div>
    <div class="pill">Best <span id="best">0</span></div>
  </div>
  <button id="muteBtn">🔊 Sound</button>
  <button id="endBtn">⏹ End</button>

  <!-- Start screen -->
  <div id="startScreen" class="overlay">
    <div class="card">
      <h1>Maddie's <span>Treat Catch</span></h1>
      <div class="emoji-row">🐕🦴🧈</div>
      <div class="byline">by Emma &amp; Maddie 🐾</div>
      <p class="hint" style="margin:8px 0 2px">Play as:</p>
      <div class="chars">
        <button class="charBtn selected" data-char="maddie">🐕<small>Maddie</small></button>
        <button class="charBtn" data-char="emma">👧<small>Emma</small></button>
        <button class="charBtn" data-char="boy">👦<small>BF</small></button>
      </div>
      <p class="hint" style="margin:10px 0 2px">Pick a mode:</p>
      <div class="modes">
        <button class="modeBtn" data-mode="classic"><b>🐾 Classic</b><small>3 lives · endless</small></button>
        <button class="modeBtn" data-mode="time"><b>⏱️ Time Attack</b><small>60-second rush</small></button>
        <button class="modeBtn" data-mode="zen"><b>🧘 Zen</b><small>no fails, just vibe</small></button>
        <button class="modeBtn" data-mode="hard"><b>🔥 Hard</b><small>1 life · fast!</small></button>
      </div>
    </div>
  </div>

  <!-- Game over screen -->
  <div id="overScreen" class="overlay hidden">
    <div class="card">
      <h2>Good girl, Maddie! 🐾</h2>
      <div class="score-line" id="overMode">Classic mode</div>
      <div class="big">🦴 <span id="finalScore">0</span></div>
      <div class="score-line">Best: <span id="finalBest" class="best">0</span></div>
      <div id="newBest" class="score-line best hidden">🎉 New high score, Emma! 🎉</div>
      <button id="againBtn">↻ Play Again</button>
      <button id="menuBtn" class="ghost">☰ Menu</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");

  // Logical game size; we scale the canvas buffer to device pixels.
  let W = 480, H = 720, DPR = 1;
  function resize(){
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  // ---------- Audio (tiny Web Audio blips) ----------
  let actx = null, muted = false;
  function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function blip(freq, dur, type, vol){
    if(muted || !actx) return;
    try{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime;
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur||0.12));
      o.start(t); o.stop(t + (dur||0.12));
    }catch(e){}
  }
  const sndCatch = () => { blip(660,0.09,"triangle",0.09); setTimeout(()=>blip(880,0.09,"triangle",0.09),70); };
  const sndBad   = () => { blip(180,0.22,"sawtooth",0.10); };
  const sndOver  = () => { blip(400,0.18,"square",0.09); setTimeout(()=>blip(300,0.18,"square",0.09),160); setTimeout(()=>blip(200,0.28,"square",0.09),330); };

  // ---------- State ----------
  const GOOD = ["🦴"];   // bones (butter is a separate big-points treat below)
  const BAD  = ["🧼","🥾","🚿","🛁"];
  let state = "start"; // start | play | over
  let score = 0, lives = 3, best = 0;
  let items = [], sparkles = [];
  let spawnTimer = 0, spawnEvery = 0.9, fallBase = 150, elapsed = 0;
  let combo = 0, bestCombo = 0, frenzy = 0, shake = 0, maxLives = 5;
  let wave = 1, waveTimer = 0, waveBanner = 0;
  let popups = [];
  let maddie = { x: W/2, w: 92, h: 78, targetX: W/2, squash: 0 };
  function comboMult(){ return Math.min(8, 1 + Math.floor(combo/5)); }

  // ----- game modes -----
  const MODES = {
    classic:{name:"🐾 Classic",    lives:3, maxLives:5, bad:true,  timed:0,  spawn0:0.9, ramp:0.012, minSpawn:0.42, fallMul:1.0},
    time:   {name:"⏱️ Time Attack", lives:0, maxLives:0, bad:true,  timed:60, spawn0:0.7, ramp:0.010, minSpawn:0.35, fallMul:1.05},
    zen:    {name:"🧘 Zen",         lives:0, maxLives:0, bad:false, timed:0,  spawn0:0.8, ramp:0.004, minSpawn:0.5,  fallMul:0.85},
    hard:   {name:"🔥 Hard",        lives:1, maxLives:3, bad:true,  timed:0,  spawn0:0.7, ramp:0.022, minSpawn:0.3,  fallMul:1.3}
  };
  let mode = "classic", cfg = MODES.classic, timeLeft = 0;
  let character = "maddie";
  function loadBest(m){ try{ return parseInt(localStorage.getItem("maddieBest_"+m)||"0",10)||0; }catch(e){ return 0; } }
  function saveBest(m,v){ try{ localStorage.setItem("maddieBest_"+m, v); }catch(e){} }

  best = loadBest(mode);

  // ---------- Input ----------
  let pointerActive = false;
  function setTargetFromClientX(clientX){
    const r = cv.getBoundingClientRect();
    maddie.targetX = Math.max(maddie.w/2, Math.min(W - maddie.w/2, clientX - r.left));
  }
  cv.addEventListener("pointerdown", e => { pointerActive = true; setTargetFromClientX(e.clientX); });
  cv.addEventListener("pointermove", e => { if(pointerActive || e.pointerType==="mouse") setTargetFromClientX(e.clientX); });
  window.addEventListener("pointerup",   () => pointerActive = false);
  const keys = {};
  window.addEventListener("keydown", e => { keys[e.key] = true; });
  window.addEventListener("keyup",   e => { keys[e.key] = false; });

  // ---------- Spawning ----------
  function spawnItem(){
    let kind, emoji, size = 34 + Math.random()*10;
    const r = Math.random();
    const canBad = cfg.bad && frenzy<=0;
    const canHeart = cfg.maxLives>0 && lives<maxLives;
    const bombChance = (cfg.bad && frenzy<=0 && wave>=2) ? Math.min(0.15, 0.03*(wave-1)) : 0;
    if(frenzy > 0){                                   // frenzy: only good, lots of butter
      if(r < 0.35){ kind="butter"; emoji="🧈"; size=42; }
      else { kind="good"; emoji=GOOD[(Math.random()*GOOD.length)|0]; }
    } else if(bombChance > 0 && Math.random() < bombChance){ kind="bomb"; emoji="💣"; size=42; }
      else if(canBad && r < 0.22){ kind="bad"; emoji=BAD[(Math.random()*BAD.length)|0]; }
      else if(canHeart && r < 0.25){ kind="heart"; emoji="💖"; size=40; }
      else if(r < 0.29){ kind="star";   emoji="⭐"; size=46; }
      else if(r < 0.41){ kind="butter"; emoji="🧈"; size=42; }
      else { kind="good"; emoji=GOOD[(Math.random()*GOOD.length)|0]; }
    items.push({
      x: size + Math.random()*(W - size*2),
      y: -size,
      vy: (fallBase + Math.random()*60 + elapsed*6 + (frenzy>0?40:0) + Math.min(140, combo*3)) * cfg.fallMul,
      size, emoji, kind, bad: (kind==="bad" || kind==="bomb"),
      rot: (Math.random()-0.5)*0.5, vr:(Math.random()-0.5)*1.2
    });
  }
  function addSparkles(x, y, color, n){
    n = n || 10;
    for(let i=0;i<n;i++){
      sparkles.push({ x, y, vx:(Math.random()-0.5)*240, vy:(Math.random()-0.9)*240,
        life:0.6, max:0.6, color });
    }
  }
  function addFloat(x, y, text, color){
    popups.push({ x, y, text, color, life:0.95, max:0.95 });
  }

  // ---------- Update ----------
  function reset(modeKey){
    mode = modeKey || mode; cfg = MODES[mode];
    score = 0; items = []; sparkles = []; popups = [];
    spawnTimer = 0; spawnEvery = cfg.spawn0; elapsed = 0;
    combo = 0; bestCombo = 0; frenzy = 0; shake = 0; maddie.squash = 0;
    wave = 1; waveTimer = 0; waveBanner = 0;
    lives = cfg.lives; maxLives = cfg.maxLives; timeLeft = cfg.timed;
    best = loadBest(mode);
    maddie.x = maddie.targetX = W/2;
    updateHud();
  }
  function loseLife(){
    lives--; updateHud(); sndBad();
    if(lives <= 0) gameOver();
  }
  function update(dt){
    if(state !== "play") return;
    elapsed += dt;
    // difficulty ramps up (per mode)
    spawnEvery = Math.max(cfg.minSpawn, cfg.spawn0 - elapsed*cfg.ramp);
    // countdown for timed modes
    if(cfg.timed > 0){ timeLeft -= dt; if(timeLeft <= 0){ timeLeft = 0; updateHud(); gameOver(); return; } }
    // timers
    if(frenzy > 0){ frenzy -= dt; if(frenzy < 0) frenzy = 0; }
    if(shake > 0){ shake -= dt; if(shake < 0) shake = 0; }
    if(maddie.squash > 0){ maddie.squash -= dt*4; if(maddie.squash < 0) maddie.squash = 0; }
    if(waveBanner > 0){ waveBanner -= dt; if(waveBanner < 0) waveBanner = 0; }
    // waves — a new one every 15s makes it hotter (more bombs)
    waveTimer += dt;
    if(waveTimer >= 15){ waveTimer = 0; wave++; waveBanner = 2.0;
      blip(520,0.12,"square",0.09); setTimeout(()=>blip(760,0.14,"square",0.09),120); }

    // keyboard movement
    const kv = 440;
    if(keys["ArrowLeft"]||keys["a"]||keys["A"])  maddie.targetX -= kv*dt;
    if(keys["ArrowRight"]||keys["d"]||keys["D"]) maddie.targetX += kv*dt;
    maddie.targetX = Math.max(maddie.w/2, Math.min(W - maddie.w/2, maddie.targetX));
    // smooth follow
    maddie.x += (maddie.targetX - maddie.x) * Math.min(1, dt*14);

    // spawn — faster in a frenzy, and a hot streak makes treats rain harder
    const heat = Math.min(1, combo/40);
    const effSpawn = (frenzy > 0 ? 0.17 : spawnEvery) * (1 - heat*0.4);
    spawnTimer += dt;
    if(spawnTimer >= effSpawn){ spawnTimer = 0; spawnItem(); }

    // catch line = top of Maddie's head
    const catchY = H - maddie.h - 24;
    for(let i = items.length-1; i>=0; i--){
      const it = items[i];
      it.y += it.vy * dt;
      it.rot += it.vr * dt;
      // collision with Maddie's catch area
      if(it.y + it.size*0.4 >= catchY && it.y - it.size*0.4 <= H - 24
         && Math.abs(it.x - maddie.x) < maddie.w*0.52){
        maddie.squash = 1; // happy hop
        if(it.kind === "bomb"){
          combo = 0; shake = 0.6; sndBad();
          if(cfg.timed > 0){ timeLeft = Math.max(0, timeLeft-5); addFloat(it.x, it.y-12, "💥 -5s", "#ff3b3b"); }
          else { lives -= 2; updateHud(); addFloat(it.x, it.y-12, "💥 BOOM", "#ff3b3b");
                 if(lives <= 0){ items.splice(i,1); gameOver(); return; } }
          addSparkles(it.x, it.y, "#ff7a3a", 24);
        } else if(it.kind === "bad"){
          combo = 0; shake = 0.35;
          if(cfg.timed > 0){ timeLeft = Math.max(0, timeLeft-3); addFloat(it.x, it.y-12, "-3s", "#ff5a5a"); }
          else { loseLife(); addFloat(it.x, it.y-12, "oops!", "#ff5a5a"); }
          addSparkles(it.x, it.y, "#9fd0ff", 8);
        } else if(it.kind === "heart"){
          if(lives < maxLives){ lives++; updateHud(); }
          blip(880,0.12,"sine",0.1); setTimeout(()=>blip(1175,0.14,"sine",0.1),90);
          addSparkles(it.x, it.y, "#ff7aa8", 14);
          addFloat(it.x, it.y-12, "+1 life 💖", "#ff5a8a");
        } else if(it.kind === "star"){
          frenzy = 6; combo++; if(combo>bestCombo) bestCombo=combo;
          sndCatch(); blip(660,0.1,"triangle",0.1); setTimeout(()=>blip(990,0.12,"triangle",0.1),90);
          addSparkles(it.x, it.y, "#ffd23e", 20);
          addFloat(it.x, it.y-12, "TREAT FRENZY!", "#ff9a1e");
        } else {
          combo++; if(combo>bestCombo) bestCombo=combo;
          const base = (it.kind === "butter") ? 5 : 1;
          const gained = base * comboMult() * (frenzy > 0 ? 2 : 1);
          score += gained; sndCatch();
          addSparkles(it.x, it.y, it.kind==="butter" ? "#ffcf3e" : "#ffd23e", it.kind==="butter"?16:10);
          addFloat(it.x, it.y-12, "+"+gained, it.kind==="butter" ? "#e8a100" : "#3a9bff");
          if(score > best){ best = score; saveBest(mode, best); }
          updateHud();
        }
        items.splice(i,1); continue;
      }
      // off the bottom (missing a plain treat is free — keep it chill)
      if(it.y - it.size > H) items.splice(i,1);
    }
    // sparkles
    for(let i=sparkles.length-1;i>=0;i--){
      const s=sparkles[i]; s.life-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=600*dt;
      if(s.life<=0) sparkles.splice(i,1);
    }
    // popups
    for(let i=popups.length-1;i>=0;i--){
      const p=popups[i]; p.life-=dt; p.y-=36*dt;
      if(p.life<=0) popups.splice(i,1);
    }
    if(cfg.timed > 0) updateHud();   // keep the countdown fresh
  }

  // ---------- Drawing ----------
  // ----- hot pink cheetah print background -----
  let _seed = 20260930;
  function srand(){ _seed = (_seed*1664525 + 1013904223) & 0x7fffffff; return _seed/0x7fffffff; }
  const spots = [];
  (function makeSpots(){
    for(let gy=0; gy<12; gy++){
      for(let gx=0; gx<7; gx++){
        spots.push({
          x:(gx+0.5)/7 + (srand()-0.5)*0.12,
          y:(gy+0.5)/12 + (srand()-0.5)*0.10,
          r: 9 + srand()*9,
          rot: srand()*Math.PI*2,
          solid: srand() < 0.38,
          seed: srand(),
          skip: srand() < 0.04
        });
      }
    }
  })();
  // small irregular filled blob (organic, kidney-ish)
  function blob(x,y,r,seed){
    ctx.beginPath();
    const n=8;
    for(let i=0;i<=n;i++){
      const a=(i/n)*Math.PI*2;
      const wob=0.78 + 0.32*Math.sin(a*2 + seed*6.3);
      const px=x+Math.cos(a)*r*wob, py=y+Math.sin(a)*r*0.72*wob;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }
  // hot-pink leopard rosette (bold broken ring of crescents) or a solid spot
  function drawSpot(cx,cy,r,rot,solid,seed){
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
    const hot="#e81d86";
    if(solid){
      ctx.fillStyle=hot; blob(0,0,r*0.44,seed);
      ctx.restore(); return;
    }
    // broken ring of 2–3 bold crescents
    ctx.strokeStyle=hot; ctx.lineWidth=Math.max(3,r*0.44); ctx.lineCap="round";
    const arcs = 2 + ((seed*10)|0)%2;
    for(let i=0;i<arcs;i++){
      const base = (i/arcs)*Math.PI*2 + seed*3;
      const span = 1.0 + seed*0.7;
      ctx.beginPath();
      ctx.ellipse(0,0, r*0.82, r*0.66, 0, base, base+span);
      ctx.stroke();
    }
    // tiny center dot on some
    if(seed>0.55){ ctx.fillStyle=hot; ctx.beginPath(); ctx.arc(0,0,r*0.15,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
  function drawBackground(dt){
    // clean pink background
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#ff9ad6"); g.addColorStop(1,"#ff5aac");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // subtle ground so Maddie has a floor
    const gh = maddie.h + 14;
    ctx.fillStyle="rgba(220,40,120,.14)"; ctx.fillRect(0,H-gh,W,gh);
    ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,H-gh+2); ctx.lineTo(W,H-gh+2); ctx.stroke();
  }

  // Draw Maddie — a mostly-white pit/beagle/boxer mix with chestnut-brown
  // patches, a white blaze up the center of the face, a brown "mask" around
  // both eyes, floppy brown ears, white muzzle, and a big dark nose.
  function drawMaddie(cx){
    const baseY = H - 16;          // feet on grass
    const bodyW = maddie.w, bodyH = maddie.h;
    ctx.save();
    ctx.translate(cx, baseY);
    const bob = Math.sin(elapsed*6)*1.5;
    ctx.translate(0, bob);
    const sq = maddie.squash || 0;               // happy hop on catch
    ctx.scale(1 - sq*0.08, 1 + sq*0.15);

    const white="#f6efe4", whiteSh="#e3d9c9", brown="#a35d2e", brownD="#71401f",
          nose="#352420", tongue="#ff7183";

    // shadow
    ctx.fillStyle="rgba(0,0,0,.15)";
    ctx.beginPath(); ctx.ellipse(0, 2, bodyW*0.5, 8, 0, 0, Math.PI*2); ctx.fill();

    // ----- body (white) -----
    ctx.fillStyle=white;
    roundRectPath(-bodyW*0.34, -bodyH*0.72, bodyW*0.68, bodyH*0.72, 20);
    ctx.fill();
    // brown saddle patch on the back (clipped to body)
    ctx.save();
    roundRectPath(-bodyW*0.34, -bodyH*0.72, bodyW*0.68, bodyH*0.72, 20);
    ctx.clip();
    ctx.fillStyle=brown;
    ctx.beginPath(); ctx.ellipse(bodyW*0.16, -bodyH*0.5, bodyW*0.27, bodyH*0.32, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    // legs (white)
    ctx.fillStyle=white; ctx.strokeStyle=whiteSh; ctx.lineWidth=2;
    ctx.beginPath(); roundRectPath(-bodyW*0.27,-12,16,14,6); ctx.fill(); ctx.stroke();
    ctx.beginPath(); roundRectPath(bodyW*0.11,-12,16,14,6); ctx.fill(); ctx.stroke();

    // tail (brown, wagging)
    ctx.save();
    ctx.translate(bodyW*0.3,-bodyH*0.55);
    ctx.rotate(Math.sin(elapsed*12)*0.5 - 0.5);
    ctx.fillStyle=brown;
    roundRectPath(0,-6,bodyW*0.22,12,6); ctx.fill();
    ctx.restore();

    // ----- head -----
    const hy = -bodyH*0.74;
    const hw = bodyW*0.36, hh = bodyH*0.36;

    // floppy brown ears (behind the head)
    ctx.fillStyle=brownD;
    ctx.save(); ctx.translate(-hw*0.92, hy+4); ctx.rotate(-0.12);
    ctx.beginPath(); ctx.ellipse(0,0, hw*0.4, hh*0.92, 0,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(hw*0.92, hy+4); ctx.rotate(0.12);
    ctx.beginPath(); ctx.ellipse(0,0, hw*0.4, hh*0.92, 0,0,Math.PI*2); ctx.fill(); ctx.restore();

    // head base (white)
    ctx.fillStyle=white;
    ctx.beginPath(); ctx.ellipse(0,hy, hw, hh, 0,0,Math.PI*2); ctx.fill();

    // markings clipped to the head
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0,hy, hw, hh, 0,0,Math.PI*2); ctx.clip();
    // brown cap over the top of the head and around the eyes
    ctx.fillStyle=brown;
    ctx.beginPath(); ctx.ellipse(0, hy-hh*0.26, hw*1.02, hh*0.92, 0,0,Math.PI*2); ctx.fill();
    // white blaze down the center (narrow at top, wider toward the muzzle)
    ctx.fillStyle=white;
    ctx.beginPath();
    ctx.moveTo(-hw*0.09, hy-hh);
    ctx.lineTo( hw*0.09, hy-hh);
    ctx.lineTo( hw*0.2,  hy+hh*0.55);
    ctx.lineTo(-hw*0.2,  hy+hh*0.55);
    ctx.closePath(); ctx.fill();
    // white muzzle (lower face)
    ctx.fillStyle=white;
    ctx.beginPath(); ctx.ellipse(0, hy+hh*0.44, hw*0.76, hh*0.6, 0,0,Math.PI*2); ctx.fill();
    ctx.restore(); // end head clip

    // eyes (dark, sitting in the brown mask either side of the blaze)
    const eyeY = hy - hh*0.05, eyeX = hw*0.36;
    ctx.fillStyle="#2b2018";
    ctx.beginPath(); ctx.arc(-eyeX, eyeY, 5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeX, eyeY, 5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(-eyeX+1.6, eyeY-1.6, 1.7,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeX+1.6, eyeY-1.6, 1.7,0,Math.PI*2); ctx.fill();

    // big dark nose on the white muzzle
    ctx.fillStyle=nose;
    ctx.beginPath(); ctx.ellipse(0, hy+hh*0.4, 8.5,6.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.35)";
    ctx.beginPath(); ctx.ellipse(-2.2, hy+hh*0.37, 2.4,1.5,0,0,Math.PI*2); ctx.fill();

    // little smile + tongue
    ctx.strokeStyle=nose; ctx.lineWidth=2; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(0, hy+hh*0.4+6.5); ctx.lineTo(0, hy+hh*0.62); ctx.stroke();
    ctx.fillStyle=tongue;
    ctx.beginPath(); ctx.ellipse(0, hy+hh*0.74, 6,5,0,0,Math.PI*2); ctx.fill();

    ctx.restore();
  }

  // pick which character to draw as the catcher
  function drawCatcher(cx){
    if(character === "emma") drawEmma(cx);
    else if(character === "boy") drawBoy(cx);
    else drawMaddie(cx);
  }

  // shared cute chibi person (arms up, catching), with glasses
  function personBase(cx, o){
    const baseY = H - 16, bw = maddie.w, bh = maddie.h;
    ctx.save();
    ctx.translate(cx, baseY);
    const bob = Math.sin(elapsed*6)*1.5; ctx.translate(0, bob);
    const sq = maddie.squash||0; ctx.scale(1 - sq*0.06, 1 + sq*0.12);
    const skin = o.skin, line = "#2b2b33";
    // shadow
    ctx.fillStyle="rgba(0,0,0,.15)";
    ctx.beginPath(); ctx.ellipse(0,2,bw*0.46,7,0,0,Math.PI*2); ctx.fill();
    // legs
    ctx.fillStyle=o.legs;
    roundRectPath(-bw*0.17,-18,bw*0.14,18,5); ctx.fill();
    roundRectPath(bw*0.03,-18,bw*0.14,18,5); ctx.fill();
    const topY=-bh*0.64, topH=bh*0.46;
    const hy = topY - bh*0.22, hr = bh*0.27;
    // hair behind head (e.g. ponytail)
    if(o.hairBack) o.hairBack(hr,hy,bw,bh);
    // body / outfit
    o.body(bw,bh,topY,topH);
    // arms up to catch
    ctx.strokeStyle=o.sleeve; ctx.lineWidth=bw*0.13; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(-bw*0.24,topY+topH*0.28); ctx.lineTo(-bw*0.33,topY-8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( bw*0.24,topY+topH*0.28); ctx.lineTo( bw*0.33,topY-8); ctx.stroke();
    ctx.fillStyle=skin;
    ctx.beginPath(); ctx.arc(-bw*0.33,topY-8,bw*0.055,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( bw*0.33,topY-8,bw*0.055,0,Math.PI*2); ctx.fill();
    // neck + head
    ctx.fillStyle=skin; ctx.fillRect(-bw*0.07, topY-bh*0.06, bw*0.14, bh*0.1);
    ctx.beginPath(); ctx.arc(0,hy,hr,0,Math.PI*2); ctx.fill();
    // hair on top
    o.hairTop(hr,hy,bw,bh);
    // glasses
    ctx.strokeStyle=line; ctx.lineWidth=2.4; ctx.lineCap="round";
    ctx.beginPath(); ctx.arc(-hr*0.4,hy+hr*0.02,hr*0.3,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc( hr*0.4,hy+hr*0.02,hr*0.3,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-hr*0.1,hy+hr*0.02); ctx.lineTo(hr*0.1,hy+hr*0.02); ctx.stroke();
    // eyes + smile
    ctx.fillStyle="#2b2018";
    ctx.beginPath(); ctx.arc(-hr*0.4,hy+hr*0.02,2.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( hr*0.4,hy+hr*0.02,2.2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#b06a55"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,hy+hr*0.4,hr*0.26,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    ctx.restore();
  }

  // Emma: blonde ponytail, glasses, leopard-print sweater
  function drawEmma(cx){
    personBase(cx, {
      skin:"#f3cdab", legs:"#f0c6a2", sleeve:"#efe7d6",
      body(bw,bh,topY,topH){
        ctx.save();
        roundRectPath(-bw*0.32,topY,bw*0.64,topH,16); ctx.fillStyle="#eee4d0"; ctx.fill();
        roundRectPath(-bw*0.32,topY,bw*0.64,topH,16); ctx.clip();
        ctx.fillStyle="#9c6b3f";
        const pts=[[-0.22,0.18],[0.04,0.14],[0.24,0.34],[-0.12,0.46],[0.16,0.58],[-0.26,0.68],[0.02,0.78],[0.26,0.74],[-0.14,0.3]];
        for(const p of pts){ ctx.beginPath(); ctx.arc(p[0]*bw*0.6, topY+p[1]*topH, 3.4,0,Math.PI*2); ctx.fill(); }
        ctx.restore();
      },
      hairBack(hr,hy){
        ctx.fillStyle="#e3b94f";
        ctx.beginPath(); ctx.ellipse(hr*0.95,hy+hr*0.3,hr*0.4,hr*0.72,0.35,0,Math.PI*2); ctx.fill();
      },
      hairTop(hr,hy){
        ctx.fillStyle="#edc65a";
        ctx.beginPath(); ctx.arc(0,hy-hr*0.06,hr*1.04,Math.PI*1.02,Math.PI*1.98); ctx.fill();
        ctx.fillRect(-hr*1.02, hy-hr*0.12, hr*2.04, hr*0.28);
      }
    });
  }

  // Boyfriend: short brown hair, glasses, black tee
  function drawBoy(cx){
    personBase(cx, {
      skin:"#f0c6a2", legs:"#26262c", sleeve:"#303038",
      body(bw,bh,topY,topH){
        ctx.fillStyle="#34343c"; roundRectPath(-bw*0.33,topY,bw*0.66,topH,16); ctx.fill();
      },
      hairTop(hr,hy){
        ctx.fillStyle="#5f4328";
        ctx.beginPath(); ctx.arc(0,hy-hr*0.04,hr*1.02,Math.PI*0.98,Math.PI*2.02); ctx.fill();
        ctx.fillRect(-hr*0.92, hy-hr*0.12, hr*1.84, hr*0.32);
      }
    });
  }

  function roundRectPath(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawItems(){
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(const it of items){
      ctx.save();
      ctx.translate(it.x,it.y);
      // dark "badge" disc behind each treat so the light ones pop on the pink
      const rad = it.size*0.6;
      ctx.fillStyle = it.kind==="bomb" ? "rgba(18,18,24,.6)"
                    : it.bad            ? "rgba(95,20,70,.5)"
                    :                      "rgba(40,16,48,.45)";
      ctx.beginPath(); ctx.arc(0,0,rad,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(0,0,rad,0,Math.PI*2); ctx.stroke();
      // the treat on top, with a crisp shadow
      ctx.rotate(it.rot);
      ctx.font = it.size+"px serif";
      ctx.shadowColor="rgba(0,0,0,.5)"; ctx.shadowBlur=3; ctx.shadowOffsetY=1;
      ctx.fillText(it.emoji, 0, 0);
      ctx.restore();
    }
  }
  function drawSparkles(){
    for(const s of sparkles){
      ctx.globalAlpha = Math.max(0, s.life/s.max);
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(s.x,s.y,3,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPopups(){
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="bold 20px 'Trebuchet MS',sans-serif";
    for(const p of popups){
      ctx.globalAlpha = Math.max(0, p.life/p.max);
      ctx.lineWidth=3; ctx.strokeStyle="rgba(255,255,255,.85)";
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle=p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha=1;
  }
  function drawComboBanner(){
    if(state !== "play") return;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    if(waveBanner > 0){
      ctx.font="bold 26px 'Trebuchet MS',sans-serif";
      ctx.lineWidth=5; ctx.strokeStyle="#fff";
      ctx.strokeText("🌊 WAVE "+wave+" 🌊", W/2, H*0.42);
      ctx.fillStyle="#ff2e8e"; ctx.fillText("🌊 WAVE "+wave+" 🌊", W/2, H*0.42);
    }
    if(frenzy > 0){
      const a = 0.65 + 0.35*Math.sin(elapsed*14);
      ctx.font="bold 22px 'Trebuchet MS',sans-serif";
      ctx.lineWidth=4; ctx.strokeStyle="#fff";
      ctx.strokeText("🔥 TREAT FRENZY! 🔥", W/2, 112);
      ctx.fillStyle="rgba(255,120,30,"+a+")";
      ctx.fillText("🔥 TREAT FRENZY! 🔥", W/2, 112);
    } else if(combo >= 3){
      ctx.font="bold 18px 'Trebuchet MS',sans-serif";
      ctx.lineWidth=3; ctx.strokeStyle="#fff";
      const t = "Combo x"+comboMult()+"  ("+combo+")";
      ctx.strokeText(t, W/2, 112);
      ctx.fillStyle="#ff2e8e";
      ctx.fillText(t, W/2, 112);
    }
  }
  function render(dt){
    ctx.save();
    if(shake > 0){ const s = shake*12; ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s); }
    drawBackground(dt);
    drawItems();
    drawCatcher(maddie.x);
    drawSparkles();
    drawPopups();
    drawComboBanner();
    ctx.restore();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now){
    let dt = (now - last)/1000; last = now;
    if(dt > 0.05) dt = 0.05; // clamp
    update(dt);
    render(dt);
    requestAnimationFrame(frame);
  }

  // ---------- HUD / Screens ----------
  const hud = document.getElementById("hud");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const livesEl = document.getElementById("lives");
  const muteBtn = document.getElementById("muteBtn");
  const endBtn = document.getElementById("endBtn");
  function updateHud(){
    scoreEl.textContent = score;
    bestEl.textContent = best;
    if(cfg.timed > 0){
      livesEl.textContent = "⏱️ " + Math.ceil(timeLeft);
    } else if(cfg.maxLives > 0){
      livesEl.textContent = "❤️".repeat(Math.max(0,lives)) + "🤍".repeat(Math.max(0,maxLives-lives));
    } else {
      livesEl.textContent = "🧘 ∞";
    }
  }
  function show(id){ document.getElementById(id).classList.remove("hidden"); }
  function hide(id){ document.getElementById(id).classList.add("hidden"); }

  function startGame(modeKey){
    ensureAudio();
    reset(modeKey);
    state = "play";
    hide("startScreen"); hide("overScreen");
    hud.classList.remove("hidden");
    muteBtn.style.display = "block";
    endBtn.style.display = "block";
  }
  function toMenu(){
    state = "start";
    hide("overScreen"); show("startScreen");
    hud.classList.add("hidden");
    muteBtn.style.display = "none";
    endBtn.style.display = "none";
  }
  function gameOver(){
    state = "over";
    sndOver();
    const prevBest = loadBest(mode);
    const isNew = score > prevBest;
    if(isNew){ saveBest(mode, score); best = score; }
    document.getElementById("overMode").textContent = cfg.name + " mode";
    document.getElementById("finalScore").textContent = score;
    document.getElementById("finalBest").textContent = Math.max(score, prevBest);
    const nb = document.getElementById("newBest");
    if(isNew && score>0) nb.classList.remove("hidden"); else nb.classList.add("hidden");
    show("overScreen");
    hud.classList.add("hidden");
    muteBtn.style.display = "none";
    endBtn.style.display = "none";
  }

  document.querySelectorAll(".modeBtn").forEach(b => {
    b.addEventListener("click", () => startGame(b.dataset.mode));
  });
  document.querySelectorAll(".charBtn").forEach(b => {
    b.addEventListener("click", () => {
      character = b.dataset.char;
      document.querySelectorAll(".charBtn").forEach(x => x.classList.toggle("selected", x === b));
    });
  });
  document.getElementById("againBtn").addEventListener("click", () => startGame(mode));
  document.getElementById("menuBtn").addEventListener("click", toMenu);
  endBtn.addEventListener("click", () => { if(state === "play") gameOver(); });
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    muteBtn.textContent = muted ? "🔇 Muted" : "🔊 Sound";
  });

  // start
  resize();
  updateHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
