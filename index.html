<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Maddie's Treat Catch</title>
<style>
  :root{
    --sky1:#8ec5ff; --sky2:#c8e9ff; --grass:#7ec85a; --grass2:#5fae3c;
    --accent:#ff7a59; --accent2:#ffb23e; --ink:#2b2135; --panel:rgba(255,255,255,.92);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    background:#1b2433;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;color:var(--ink);overflow:hidden;
  }
  #wrap{
    position:relative;width:min(96vw,480px);height:min(92vh,720px);
    border-radius:22px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 0 0 4px rgba(255,255,255,.15);
    background:linear-gradient(180deg,#ff92d2,#ff2b90 55%);
    touch-action:none;user-select:none;
  }
  canvas{display:block;width:100%;height:100%;}

  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:center;padding:12px 16px;pointer-events:none;font-weight:bold;}
  .pill{background:var(--panel);padding:6px 12px;border-radius:999px;
    box-shadow:0 3px 0 rgba(0,0,0,.12);font-size:15px;}
  #lives{letter-spacing:2px;font-size:18px;}

  /* Overlays */
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
    background:linear-gradient(180deg,rgba(27,36,51,.35),rgba(27,36,51,.55));
    backdrop-filter:blur(2px);}
  .hidden{display:none !important;}
  .card{background:var(--panel);border-radius:20px;padding:26px 24px;max-width:340px;
    box-shadow:0 16px 40px rgba(0,0,0,.35);}
  h1{margin:0 0 4px;font-size:30px;color:var(--ink);line-height:1.05;}
  h1 span{color:var(--accent);}
  h2{margin:0 0 6px;font-size:26px;}
  p{margin:8px 0;font-size:15px;color:#4a4257;line-height:1.4;}
  .big{font-size:40px;margin:2px 0;}
  button{
    font-family:inherit;font-weight:bold;font-size:19px;cursor:pointer;
    color:#fff;border:none;border-radius:14px;padding:14px 30px;margin-top:6px;
    background:linear-gradient(180deg,var(--accent2),var(--accent));
    box-shadow:0 5px 0 #d9542f,0 10px 20px rgba(0,0,0,.25);
    transition:transform .05s,box-shadow .05s;
  }
  button:active{transform:translateY(4px);box-shadow:0 1px 0 #d9542f;}
  .hint{font-size:13px;color:#6b6478;margin-top:10px;}
  .emoji-row{font-size:26px;letter-spacing:4px;margin:6px 0;}
  .score-line{font-size:17px;color:#4a4257;}
  .best{color:var(--accent);font-weight:bold;}
  #muteBtn{position:absolute;bottom:10px;left:12px;
    pointer-events:auto;background:var(--panel);color:var(--ink);
    font-size:13px;padding:5px 12px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.12);
    display:none;}
  #muteBtn:active{transform:translateY(2px);box-shadow:none;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="pill">🦴 <span id="score">0</span></div>
    <div class="pill" id="lives">❤️❤️❤️</div>
    <div class="pill">Best <span id="best">0</span></div>
  </div>
  <button id="muteBtn">🔊 Sound</button>

  <!-- Start screen -->
  <div id="startScreen" class="overlay">
    <div class="card">
      <h1>Maddie's <span>Treat Catch</span></h1>
      <div class="emoji-row">🐕🦴🍖🍪</div>
      <p>Move <b>Maddie</b> to catch the treats and build combos!<br>
         🥩 big points &nbsp;·&nbsp; ⭐ treat frenzy &nbsp;·&nbsp; 💖 extra life<br>
         Dodge the <b>bath stuff</b> 🧼🥾🚿 — she hates those!</p>
      <p class="hint">Move: drag / mouse / ← → keys</p>
      <button id="playBtn">▶ Play</button>
    </div>
  </div>

  <!-- Game over screen -->
  <div id="overScreen" class="overlay hidden">
    <div class="card">
      <h2>Good girl, Maddie! 🐾</h2>
      <div class="score-line">You caught</div>
      <div class="big">🦴 <span id="finalScore">0</span></div>
      <div class="score-line">Best: <span id="finalBest" class="best">0</span></div>
      <div id="newBest" class="score-line best hidden">🎉 New high score! 🎉</div>
      <button id="againBtn">↻ Play Again</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");

  // Logical game size; we scale the canvas buffer to device pixels.
  let W = 480, H = 720, DPR = 1;
  function resize(){
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  // ---------- Audio (tiny Web Audio blips) ----------
  let actx = null, muted = false;
  function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function blip(freq, dur, type, vol){
    if(muted || !actx) return;
    try{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime;
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur||0.12));
      o.start(t); o.stop(t + (dur||0.12));
    }catch(e){}
  }
  const sndCatch = () => { blip(660,0.09,"triangle",0.09); setTimeout(()=>blip(880,0.09,"triangle",0.09),70); };
  const sndBad   = () => { blip(180,0.22,"sawtooth",0.10); };
  const sndOver  = () => { blip(400,0.18,"square",0.09); setTimeout(()=>blip(300,0.18,"square",0.09),160); setTimeout(()=>blip(200,0.28,"square",0.09),330); };

  // ---------- State ----------
  const GOOD = ["🦴","🍖","🍪","🥓","🧀"];
  const BAD  = ["🧼","🥾","🚿","🛁"];
  let state = "start"; // start | play | over
  let score = 0, lives = 3, best = 0;
  let items = [], sparkles = [];
  let spawnTimer = 0, spawnEvery = 0.9, fallBase = 150, elapsed = 0;
  let combo = 0, bestCombo = 0, frenzy = 0, shake = 0, maxLives = 5;
  let popups = [];
  let maddie = { x: W/2, w: 92, h: 78, targetX: W/2, squash: 0 };
  function comboMult(){ return Math.min(5, 1 + Math.floor(combo/6)); }

  try { best = parseInt(localStorage.getItem("maddieBest")||"0",10) || 0; } catch(e){ best = 0; }

  // ---------- Input ----------
  let pointerActive = false;
  function setTargetFromClientX(clientX){
    const r = cv.getBoundingClientRect();
    maddie.targetX = Math.max(maddie.w/2, Math.min(W - maddie.w/2, clientX - r.left));
  }
  cv.addEventListener("pointerdown", e => { pointerActive = true; setTargetFromClientX(e.clientX); });
  cv.addEventListener("pointermove", e => { if(pointerActive || e.pointerType==="mouse") setTargetFromClientX(e.clientX); });
  window.addEventListener("pointerup",   () => pointerActive = false);
  const keys = {};
  window.addEventListener("keydown", e => { keys[e.key] = true; });
  window.addEventListener("keyup",   e => { keys[e.key] = false; });

  // ---------- Spawning ----------
  function spawnItem(){
    let kind, emoji, size = 34 + Math.random()*10;
    const r = Math.random();
    if(frenzy > 0){                                   // frenzy: only good, lots of steaks
      if(r < 0.3){ kind="steak"; emoji="🥩"; size=44; }
      else { kind="good"; emoji=GOOD[(Math.random()*GOOD.length)|0]; }
    } else if(r < 0.23){ kind="bad";  emoji=BAD[(Math.random()*BAD.length)|0]; }
      else if(r < 0.26 && lives < maxLives){ kind="heart"; emoji="💖"; size=40; }
      else if(r < 0.30){ kind="star";  emoji="⭐"; size=46; }
      else if(r < 0.38){ kind="steak"; emoji="🥩"; size=44; }
      else { kind="good"; emoji=GOOD[(Math.random()*GOOD.length)|0]; }
    items.push({
      x: size + Math.random()*(W - size*2),
      y: -size,
      vy: fallBase + Math.random()*60 + elapsed*6 + (frenzy>0?40:0),
      size, emoji, kind, bad: kind==="bad",
      rot: (Math.random()-0.5)*0.5, vr:(Math.random()-0.5)*1.2
    });
  }
  function addSparkles(x, y, color, n){
    n = n || 10;
    for(let i=0;i<n;i++){
      sparkles.push({ x, y, vx:(Math.random()-0.5)*240, vy:(Math.random()-0.9)*240,
        life:0.6, max:0.6, color });
    }
  }
  function addFloat(x, y, text, color){
    popups.push({ x, y, text, color, life:0.95, max:0.95 });
  }

  // ---------- Update ----------
  function reset(){
    score = 0; lives = 3; items = []; sparkles = []; popups = [];
    spawnTimer = 0; spawnEvery = 0.9; elapsed = 0;
    combo = 0; bestCombo = 0; frenzy = 0; shake = 0; maddie.squash = 0;
    maddie.x = maddie.targetX = W/2;
    updateHud();
  }
  function loseLife(){
    lives--; updateHud(); sndBad();
    if(lives <= 0) gameOver();
  }
  function update(dt){
    if(state !== "play") return;
    elapsed += dt;
    // difficulty ramps up slowly
    spawnEvery = Math.max(0.42, 0.9 - elapsed*0.012);
    // timers
    if(frenzy > 0){ frenzy -= dt; if(frenzy < 0) frenzy = 0; }
    if(shake > 0){ shake -= dt; if(shake < 0) shake = 0; }
    if(maddie.squash > 0){ maddie.squash -= dt*4; if(maddie.squash < 0) maddie.squash = 0; }

    // keyboard movement
    const kv = 440;
    if(keys["ArrowLeft"]||keys["a"]||keys["A"])  maddie.targetX -= kv*dt;
    if(keys["ArrowRight"]||keys["d"]||keys["D"]) maddie.targetX += kv*dt;
    maddie.targetX = Math.max(maddie.w/2, Math.min(W - maddie.w/2, maddie.targetX));
    // smooth follow
    maddie.x += (maddie.targetX - maddie.x) * Math.min(1, dt*14);

    // spawn (much faster during a frenzy)
    const effSpawn = frenzy > 0 ? 0.17 : spawnEvery;
    spawnTimer += dt;
    if(spawnTimer >= effSpawn){ spawnTimer = 0; spawnItem(); }

    // catch line = top of Maddie's head
    const catchY = H - maddie.h - 24;
    for(let i = items.length-1; i>=0; i--){
      const it = items[i];
      it.y += it.vy * dt;
      it.rot += it.vr * dt;
      // collision with Maddie's catch area
      if(it.y + it.size*0.4 >= catchY && it.y - it.size*0.4 <= H - 24
         && Math.abs(it.x - maddie.x) < maddie.w*0.52){
        maddie.squash = 1; // happy hop
        if(it.kind === "bad"){
          combo = 0; shake = 0.35; loseLife();
          addSparkles(it.x, it.y, "#9fd0ff", 8);
          addFloat(it.x, it.y-12, "oops!", "#ff5a5a");
        } else if(it.kind === "heart"){
          if(lives < maxLives){ lives++; updateHud(); }
          blip(880,0.12,"sine",0.1); setTimeout(()=>blip(1175,0.14,"sine",0.1),90);
          addSparkles(it.x, it.y, "#ff7aa8", 14);
          addFloat(it.x, it.y-12, "+1 life 💖", "#ff5a8a");
        } else if(it.kind === "star"){
          frenzy = 6; combo++; if(combo>bestCombo) bestCombo=combo;
          sndCatch(); blip(660,0.1,"triangle",0.1); setTimeout(()=>blip(990,0.12,"triangle",0.1),90);
          addSparkles(it.x, it.y, "#ffd23e", 20);
          addFloat(it.x, it.y-12, "TREAT FRENZY!", "#ff9a1e");
        } else {
          combo++; if(combo>bestCombo) bestCombo=combo;
          const base = (it.kind === "steak") ? 5 : 1;
          const gained = base * comboMult() * (frenzy > 0 ? 2 : 1);
          score += gained; sndCatch();
          addSparkles(it.x, it.y, it.kind==="steak" ? "#ff9a3e" : "#ffd23e", it.kind==="steak"?16:10);
          addFloat(it.x, it.y-12, "+"+gained, it.kind==="steak" ? "#ff7a2e" : "#3a9bff");
          if(score > best){ best = score; try{localStorage.setItem("maddieBest",best);}catch(e){} }
          updateHud();
        }
        items.splice(i,1); continue;
      }
      // off the bottom (missing a plain treat is free — keep it chill)
      if(it.y - it.size > H) items.splice(i,1);
    }
    // sparkles
    for(let i=sparkles.length-1;i>=0;i--){
      const s=sparkles[i]; s.life-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=600*dt;
      if(s.life<=0) sparkles.splice(i,1);
    }
    // popups
    for(let i=popups.length-1;i>=0;i--){
      const p=popups[i]; p.life-=dt; p.y-=36*dt;
      if(p.life<=0) popups.splice(i,1);
    }
  }

  // ---------- Drawing ----------
  // ----- hot pink cheetah print background -----
  let _seed = 20260930;
  function srand(){ _seed = (_seed*1664525 + 1013904223) & 0x7fffffff; return _seed/0x7fffffff; }
  const spots = [];
  (function makeSpots(){
    for(let gy=0; gy<10; gy++){
      for(let gx=0; gx<6; gx++){
        spots.push({
          x:(gx+0.5)/6 + (srand()-0.5)*0.15,
          y:(gy+0.5)/10 + (srand()-0.5)*0.12,
          r: 13 + srand()*13,
          rot: srand()*Math.PI*2,
          solid: srand() < 0.3,
          seed: srand(),
          skip: srand() < 0.06
        });
      }
    }
  })();
  // small irregular filled blob (organic, kidney-ish)
  function blob(x,y,r,seed){
    ctx.beginPath();
    const n=8;
    for(let i=0;i<=n;i++){
      const a=(i/n)*Math.PI*2;
      const wob=0.78 + 0.32*Math.sin(a*2 + seed*6.3);
      const px=x+Math.cos(a)*r*wob, py=y+Math.sin(a)*r*0.72*wob;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }
  // leopard rosette (a broken ring of organic dark petals) or a solid spot
  function drawSpot(cx,cy,r,rot,solid,seed){
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
    const dark="rgba(32,12,15,.86)";
    if(solid){
      ctx.fillStyle=dark; blob(0,0,r*0.44,seed);
      ctx.restore(); return;
    }
    // tawny center
    ctx.fillStyle="rgba(140,56,30,.22)";
    ctx.beginPath(); ctx.ellipse(0,0,r*0.5,r*0.42,0,0,Math.PI*2); ctx.fill();
    // ring of dark petals with one gap => broken rosette
    ctx.fillStyle=dark;
    const petals=5, gap=(seed*petals)|0;
    for(let i=0;i<petals;i++){
      if(i===gap) continue;
      const a=(i/petals)*Math.PI*2;
      const px=Math.cos(a)*r*0.9, py=Math.sin(a)*r*0.76;
      const pr=r*(0.3 + ((i*7+seed*13)%10)/55);
      ctx.save(); ctx.translate(px,py); ctx.rotate(a+1.1);
      blob(0,0,pr,seed+i*0.37);
      ctx.restore();
    }
    ctx.restore();
  }
  function drawBackground(dt){
    // hot pink base
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#ff92d2"); g.addColorStop(.5,"#ff4fa8"); g.addColorStop(1,"#ff2b90");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // cheetah spots across everything
    for(const s of spots){ if(!s.skip) drawSpot(s.x*W, s.y*H, s.r, s.rot, s.solid, s.seed); }
    // ground strip (deeper magenta) so Maddie has a floor
    const gh = maddie.h + 14;
    const gg = ctx.createLinearGradient(0,H-gh,0,H);
    gg.addColorStop(0,"rgba(201,24,112,.5)"); gg.addColorStop(1,"rgba(140,8,74,.7)");
    ctx.fillStyle=gg; ctx.fillRect(0,H-gh,W,gh);
    ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,H-gh+2); ctx.lineTo(W,H-gh+2); ctx.stroke();
  }

  // Draw Maddie — a mostly-white pit/beagle/boxer mix with chestnut-brown
  // patches, a white blaze up the center of the face, a brown "mask" around
  // both eyes, floppy brown ears, white muzzle, and a big dark nose.
  function drawMaddie(cx){
    const baseY = H - 16;          // feet on grass
    const bodyW = maddie.w, bodyH = maddie.h;
    ctx.save();
    ctx.translate(cx, baseY);
    const bob = Math.sin(elapsed*6)*1.5;
    ctx.translate(0, bob);
    const sq = maddie.squash || 0;               // happy hop on catch
    ctx.scale(1 - sq*0.08, 1 + sq*0.15);

    const white="#f6efe4", whiteSh="#e3d9c9", brown="#a35d2e", brownD="#71401f",
          nose="#352420", tongue="#ff7183";

    // shadow
    ctx.fillStyle="rgba(0,0,0,.15)";
    ctx.beginPath(); ctx.ellipse(0, 2, bodyW*0.5, 8, 0, 0, Math.PI*2); ctx.fill();

    // ----- body (white) -----
    ctx.fillStyle=white;
    roundRectPath(-bodyW*0.34, -bodyH*0.72, bodyW*0.68, bodyH*0.72, 20);
    ctx.fill();
    // brown saddle patch on the back (clipped to body)
    ctx.save();
    roundRectPath(-bodyW*0.34, -bodyH*0.72, bodyW*0.68, bodyH*0.72, 20);
    ctx.clip();
    ctx.fillStyle=brown;
    ctx.beginPath(); ctx.ellipse(bodyW*0.16, -bodyH*0.5, bodyW*0.27, bodyH*0.32, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    // legs (white)
    ctx.fillStyle=white; ctx.strokeStyle=whiteSh; ctx.lineWidth=2;
    ctx.beginPath(); roundRectPath(-bodyW*0.27,-12,16,14,6); ctx.fill(); ctx.stroke();
    ctx.beginPath(); roundRectPath(bodyW*0.11,-12,16,14,6); ctx.fill(); ctx.stroke();

    // tail (brown, wagging)
    ctx.save();
    ctx.translate(bodyW*0.3,-bodyH*0.55);
    ctx.rotate(Math.sin(elapsed*12)*0.5 - 0.5);
    ctx.fillStyle=brown;
    roundRectPath(0,-6,bodyW*0.22,12,6); ctx.fill();
    ctx.restore();

    // ----- head -----
    const hy = -bodyH*0.74;
    const hw = bodyW*0.36, hh = bodyH*0.36;

    // floppy brown ears (behind the head)
    ctx.fillStyle=brownD;
    ctx.save(); ctx.translate(-hw*0.92, hy+4); ctx.rotate(-0.12);
    ctx.beginPath(); ctx.ellipse(0,0, hw*0.4, hh*0.92, 0,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(hw*0.92, hy+4); ctx.rotate(0.12);
    ctx.beginPath(); ctx.ellipse(0,0, hw*0.4, hh*0.92, 0,0,Math.PI*2); ctx.fill(); ctx.restore();

    // head base (white)
    ctx.fillStyle=white;
    ctx.beginPath(); ctx.ellipse(0,hy, hw, hh, 0,0,Math.PI*2); ctx.fill();

    // markings clipped to the head
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0,hy, hw, hh, 0,0,Math.PI*2); ctx.clip();
    // brown cap over the top of the head and around the eyes
    ctx.fillStyle=brown;
    ctx.beginPath(); ctx.ellipse(0, hy-hh*0.26, hw*1.02, hh*0.92, 0,0,Math.PI*2); ctx.fill();
    // white blaze down the center (narrow at top, wider toward the muzzle)
    ctx.fillStyle=white;
    ctx.beginPath();
    ctx.moveTo(-hw*0.09, hy-hh);
    ctx.lineTo( hw*0.09, hy-hh);
    ctx.lineTo( hw*0.2,  hy+hh*0.55);
    ctx.lineTo(-hw*0.2,  hy+hh*0.55);
    ctx.closePath(); ctx.fill();
    // white muzzle (lower face)
    ctx.fillStyle=white;
    ctx.beginPath(); ctx.ellipse(0, hy+hh*0.44, hw*0.76, hh*0.6, 0,0,Math.PI*2); ctx.fill();
    ctx.restore(); // end head clip

    // eyes (dark, sitting in the brown mask either side of the blaze)
    const eyeY = hy - hh*0.05, eyeX = hw*0.36;
    ctx.fillStyle="#2b2018";
    ctx.beginPath(); ctx.arc(-eyeX, eyeY, 5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeX, eyeY, 5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(-eyeX+1.6, eyeY-1.6, 1.7,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( eyeX+1.6, eyeY-1.6, 1.7,0,Math.PI*2); ctx.fill();

    // big dark nose on the white muzzle
    ctx.fillStyle=nose;
    ctx.beginPath(); ctx.ellipse(0, hy+hh*0.4, 8.5,6.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.35)";
    ctx.beginPath(); ctx.ellipse(-2.2, hy+hh*0.37, 2.4,1.5,0,0,Math.PI*2); ctx.fill();

    // little smile + tongue
    ctx.strokeStyle=nose; ctx.lineWidth=2; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(0, hy+hh*0.4+6.5); ctx.lineTo(0, hy+hh*0.62); ctx.stroke();
    ctx.fillStyle=tongue;
    ctx.beginPath(); ctx.ellipse(0, hy+hh*0.74, 6,5,0,0,Math.PI*2); ctx.fill();

    ctx.restore();
  }

  function roundRectPath(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawItems(){
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(const it of items){
      ctx.save();
      ctx.translate(it.x,it.y); ctx.rotate(it.rot);
      ctx.font = it.size+"px serif";
      ctx.fillText(it.emoji, 0, 0);
      ctx.restore();
    }
  }
  function drawSparkles(){
    for(const s of sparkles){
      ctx.globalAlpha = Math.max(0, s.life/s.max);
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(s.x,s.y,3,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPopups(){
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="bold 20px 'Trebuchet MS',sans-serif";
    for(const p of popups){
      ctx.globalAlpha = Math.max(0, p.life/p.max);
      ctx.lineWidth=3; ctx.strokeStyle="rgba(255,255,255,.85)";
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle=p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha=1;
  }
  function drawComboBanner(){
    if(state !== "play") return;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    if(frenzy > 0){
      const a = 0.65 + 0.35*Math.sin(elapsed*14);
      ctx.font="bold 22px 'Trebuchet MS',sans-serif";
      ctx.lineWidth=4; ctx.strokeStyle="#fff";
      ctx.strokeText("🔥 TREAT FRENZY! 🔥", W/2, 112);
      ctx.fillStyle="rgba(255,120,30,"+a+")";
      ctx.fillText("🔥 TREAT FRENZY! 🔥", W/2, 112);
    } else if(combo >= 3){
      ctx.font="bold 18px 'Trebuchet MS',sans-serif";
      ctx.lineWidth=3; ctx.strokeStyle="#fff";
      const t = "Combo x"+comboMult()+"  ("+combo+")";
      ctx.strokeText(t, W/2, 112);
      ctx.fillStyle="#ff2e8e";
      ctx.fillText(t, W/2, 112);
    }
  }
  function render(dt){
    ctx.save();
    if(shake > 0){ const s = shake*12; ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s); }
    drawBackground(dt);
    drawItems();
    drawMaddie(maddie.x);
    drawSparkles();
    drawPopups();
    drawComboBanner();
    ctx.restore();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now){
    let dt = (now - last)/1000; last = now;
    if(dt > 0.05) dt = 0.05; // clamp
    update(dt);
    render(dt);
    requestAnimationFrame(frame);
  }

  // ---------- HUD / Screens ----------
  const hud = document.getElementById("hud");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const livesEl = document.getElementById("lives");
  const muteBtn = document.getElementById("muteBtn");
  function updateHud(){
    scoreEl.textContent = score;
    bestEl.textContent = best;
    livesEl.textContent = "❤️".repeat(Math.max(0,lives)) + "🤍".repeat(Math.max(0,maxLives-lives));
  }
  function show(id){ document.getElementById(id).classList.remove("hidden"); }
  function hide(id){ document.getElementById(id).classList.add("hidden"); }

  function startGame(){
    ensureAudio();
    reset();
    state = "play";
    hide("startScreen"); hide("overScreen");
    hud.classList.remove("hidden");
    muteBtn.style.display = "block";
  }
  function gameOver(){
    state = "over";
    sndOver();
    document.getElementById("finalScore").textContent = score;
    document.getElementById("finalBest").textContent = best;
    const nb = document.getElementById("newBest");
    if(score >= best && score>0) nb.classList.remove("hidden"); else nb.classList.add("hidden");
    show("overScreen");
    hud.classList.add("hidden");
  }

  document.getElementById("playBtn").addEventListener("click", startGame);
  document.getElementById("againBtn").addEventListener("click", startGame);
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    muteBtn.textContent = muted ? "🔇 Muted" : "🔊 Sound";
  });

  // start
  resize();
  updateHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
